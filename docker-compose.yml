# Crede Phase 1 — API only
# Postgres: Coolify managed resource via DATABASE_URL (use postgresql://)
# Network: join Coolify network so internal DB hostname resolves

services:
  api:
    build: ./apps/api
    ports:
      - "8008:8008"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCOUNTS_URL: ${ACCOUNTS_URL}
      ACCOUNTS_PUBLIC_URL: ${ACCOUNTS_PUBLIC_URL:-https://accounts.collab.name.ng}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://crede.collab.name.ng}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.collab.name.ng}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-crede}
      S3_REGION: ${S3_REGION:-us-east-1}
    networks:
      - coolify
    restart: unless-stopped

networks:
  coolify:
    external: true
    name: coolify