# Crede Phase 2 — API + Redis + Meilisearch (Postgres usually managed externally)
services:
  api:
    build: ./apps/api
    ports:
      - "8008:8008"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      AUTH_MODE: ${AUTH_MODE:-local}
      ACCOUNTS_URL: ${ACCOUNTS_URL:-https://accounts.collab.name.ng}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://crede.collab.name.ng,http://localhost:3001}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      STORAGE_ROOT: /data/crede
      REDIS_URL: redis://redis:6379/0
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-crede_meili_master}
    volumes:
      - crede_data:/data/crede
    depends_on:
      - redis
      - meilisearch
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.11
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-crede_meili_master}
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

volumes:
  crede_data:
  meili_data:
