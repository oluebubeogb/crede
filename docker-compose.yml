services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio123}
    volumes:
      - crede_minio:/data
    restart: unless-stopped

  api:
    build: ./apps/api
    ports:
      - "8008:8008"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCOUNTS_URL: ${ACCOUNTS_URL}
      ACCOUNTS_PUBLIC_URL: ${ACCOUNTS_PUBLIC_URL:-https://accounts.collab.name.ng}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://crede.collab.name.ng}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.collab.name.ng}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio123}
      S3_BUCKET: ${S3_BUCKET:-crede}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      - minio
    restart: unless-stopped

volumes:
  crede_minio: