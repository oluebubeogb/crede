# Crede API — matches Phase 1 Coolify networking.
# MUST join external network "coolify" so DATABASE_URL internal hostnames resolve.
# Redis / Meilisearch are optional (leave REDIS_URL / MEILI_URL empty).

services:
  api:
    build: ./apps/api
    ports:
      - "8008:8008"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      AUTH_MODE: ${AUTH_MODE:-local}
      ACCOUNTS_URL: ${ACCOUNTS_URL:-https://accounts.collab.name.ng}
      ACCOUNTS_PUBLIC_URL: ${ACCOUNTS_PUBLIC_URL:-https://accounts.collab.name.ng}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://crede.collab.name.ng}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.collab.name.ng}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/crede}
      REDIS_URL: ${REDIS_URL:-}
      MEILI_URL: ${MEILI_URL:-}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
    volumes:
      - crede_data:/data/crede
    networks:
      - coolify
    restart: unless-stopped

volumes:
  crede_data:

networks:
  coolify:
    external: true
    name: coolify
